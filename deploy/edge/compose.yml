name: smartmetrix-edge

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  env_file: ["${SMARTMETRIX_ENV_FILE:-/etc/smartmetrix/edge.env}"]
  platform: linux/arm64
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  logging: *logging
  networks: [backend]
  environment: &common-environment
    ASPNETCORE_ENVIRONMENT: Production
    SmartMetrix__DeploymentProfile: Production
    Persistence__Provider: Postgres
    SmartMetrix__Messaging__Url: nats://nats:4222
  depends_on:
    nats: { condition: service_healthy }
    postgres: { condition: service_healthy }

x-build: &build
  context: ../..
  dockerfile: deploy/edge/Dockerfile
  platforms: [linux/arm64]

services:
  nats:
    image: nats:2.11-alpine
    platform: linux/arm64
    command: ["--jetstream", "--store_dir=/data", "--max_file_store=8GB", "--http_port=8222"]
    restart: unless-stopped
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/nats:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [backend]

  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/arm64
    restart: unless-stopped
    env_file: ["${SMARTMETRIX_ENV_FILE:-/etc/smartmetrix/edge.env}"]
    environment:
      POSTGRES_DB: smartmetrix
      POSTGRES_USER: smartmetrix
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmetrix -d smartmetrix"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    platform: linux/arm64
    command: server /data --console-address :9001
    restart: unless-stopped
    env_file: ["${SMARTMETRIX_ENV_FILE:-/etc/smartmetrix/edge.env}"]
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [backend]

  storage-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-storage:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.StorageService } }
    env_file: ["${SMARTMETRIX_ENV_FILE:-/etc/smartmetrix/edge.env}"]
    environment:
      <<: *common-environment
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-smartmetrix}
    depends_on:
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }

  measurement-orchestrator:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-orchestrator:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.MeasurementOrchestrator } }
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/orchestrator:/app/data"]
    environment:
      <<: *common-environment
      Pipeline__Enabled: "true"
      Pipeline__RigId: ${SMARTMETRIX_RIG_ID:?set SMARTMETRIX_RIG_ID}
      CaptureTrigger__Enabled: "true"
      CaptureTrigger__RigId: ${SMARTMETRIX_RIG_ID}
      CaptureTrigger__ExcavatorId: ${SMARTMETRIX_EXCAVATOR_ID:?set SMARTMETRIX_EXCAVATOR_ID}
      CaptureTrigger__CoordinateSystemId: ${SMARTMETRIX_COORDINATE_SYSTEM_ID:?set SMARTMETRIX_COORDINATE_SYSTEM_ID}
      CaptureTrigger__ConsumerName: capture-${SMARTMETRIX_RIG_ID}
      CloudDispatch__Enabled: ${SMARTMETRIX_CLOUD_DISPATCH_ENABLED:-false}
      CloudDispatch__BaseUrl: http://cloud-sync-service:8080
      Pipeline__RequestTimeoutSeconds: 240
      MeasurementWorkflow__StageTimeoutSeconds: 900
      Pipeline__CalibrationUrl: http://calibration-service:8080
      Pipeline__CameraUrl: http://camera-service:8080
      Pipeline__QualityUrl: http://quality-service:8080
      Pipeline__DepthUrl: http://depth-service:8080
      Pipeline__SegmentationUrl: http://segmentation-service:8080
      Pipeline__AnalysisUrl: http://block-analysis-service:8080
      Pipeline__PositioningUrl: http://local-positioning-service:8080
      Pipeline__GeoreferenceUrl: http://georeference-service:8080
      Pipeline__StorageUrl: http://storage-service:8080

  camera-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-camera:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.CameraService } }
    # NVIDIA Container Toolkit exposes the Jetson GPU without privileged mode.
    runtime: nvidia
    gpus: all
    group_add: ["${VIDEO_GID:-44}"]
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}"
    volumes:
      - /usr/local/cuda:/usr/local/cuda:ro
      - /opt/nvidia:/opt/nvidia:ro
      - ${ARENA_SDK_ROOT:-/opt/arena}:/opt/arena:ro
      - ${SMARTMETRIX_NATIVE_ROOT:-/opt/smartmetrix/native}:/app/native:ro
      - ${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/camera:/app/data
    environment:
      <<: *common-environment
      Camera__Adapter: ${CAMERA_ADAPTER:-Arena}
      Camera__StorageServiceUrl: http://storage-service:8080
      Camera__CameraASerialNumber: ${CAMERA_A_SERIAL:?set CAMERA_A_SERIAL}
      Camera__CameraBSerialNumber: ${CAMERA_B_SERIAL:?set CAMERA_B_SERIAL}
      Camera__CameraCSerialNumber: ${CAMERA_C_SERIAL:?set CAMERA_C_SERIAL}
      Camera__TriggerSource: ${CAMERA_TRIGGER_SOURCE:-Line0}
      Camera__TriggerActivation: ${CAMERA_TRIGGER_ACTIVATION:-RisingEdge}
      Camera__PixelFormat: ${CAMERA_PIXEL_FORMAT:-Mono8}
      LD_LIBRARY_PATH: /app/native:/opt/arena/lib64:/opt/arena/lib
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    depends_on:
      storage-service: { condition: service_healthy }

  depth-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-depth:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.DepthService } }
    runtime: nvidia
    gpus: all
    volumes:
      - ${SMARTMETRIX_NATIVE_ROOT:-/opt/smartmetrix/native}:/app/native:ro
      - ${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/depth:/app/data
      - /usr/local/cuda:/usr/local/cuda:ro
      - /opt/nvidia/vpi2:/opt/nvidia/vpi2:ro
      - ${SMARTMETRIX_CALIBRATION_ROOT:-/opt/smartmetrix/calibration}:/app/calibration:ro
    environment:
      <<: *common-environment
      Depth__Backend: ${DEPTH_BACKEND:-Native}
      Depth__NativeProvider: ${DEPTH_NATIVE_PROVIDER:-OpenCvCuda}
      Depth__StorageBaseUrl: http://storage-service:8080
      Depth__CalibrationDirectory: /app/calibration
      LD_LIBRARY_PATH: /app/native:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    depends_on:
      storage-service: { condition: service_healthy }

  segmentation-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-segmentation:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.SegmentationService } }
    runtime: nvidia
    gpus: all
    volumes:
      - ${SMARTMETRIX_MODEL_ROOT:-/opt/smartmetrix/models}:/app/models:ro
      - ${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/segmentation:/app/data
    environment:
      <<: *common-environment
      Segmentation__StorageBaseUrl: http://storage-service:8080
      Segmentation__Backend: StoneVision
      Segmentation__StoneVisionBaseUrl: ${STONEVISION_URL:?set STONEVISION_URL}
      Segmentation__ModelVersion: ${STONEVISION_MODEL_VERSION:?set STONEVISION_MODEL_VERSION}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    depends_on:
      storage-service: { condition: service_healthy }

  quality-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-quality:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.QualityService } }
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/quality:/app/data"]

  trigger-service:
    <<: *service
    depends_on:
      nats: { condition: service_healthy }
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-trigger:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.TriggerService } }
    environment:
      <<: *common-environment
      Trigger__RigId: ${SMARTMETRIX_RIG_ID}
      Trigger__ExcavatorId: ${SMARTMETRIX_EXCAVATOR_ID}

  calibration-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-calibration:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.CalibrationService } }

  local-positioning-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-positioning:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.LocalPositioningService } }

  georeference-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-georeference:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.GeoreferenceService } }

  block-analysis-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-block-analysis:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.BlockAnalysisService } }
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/analysis:/app/data"]

  control-point-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-control-point:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.ControlPointService } }

  cloud-sync-service:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-cloud-sync:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.CloudSyncService } }
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/cloud-sync:/app/data"]
    environment:
      <<: *common-environment
      CloudSync__StorageBaseUrl: http://storage-service:8080

  api-gateway:
    <<: *service
    image: ${SMARTMETRIX_REGISTRY:-ghcr.io/atitov}/smartmetrix-api:${SMARTMETRIX_VERSION:-current}
    build: { <<: *build, args: { SERVICE: SmartMetrix.ApiGateway } }
    volumes: ["${SMARTMETRIX_DATA_ROOT:-/var/lib/smartmetrix}/api:/app/data"]
    env_file: ["${SMARTMETRIX_ENV_FILE:-/etc/smartmetrix/edge.env}"]
    ports: ["${SMARTMETRIX_HTTP_BIND:-127.0.0.1}:8080:8080"]
    environment:
      <<: *common-environment
      OperatorApi__OrchestratorUrl: http://measurement-orchestrator:8080
      OperatorApi__Components__0__ReadyUrl: http://camera-service:8080/ready
      OperatorApi__Components__1__ReadyUrl: http://storage-service:8080/ready
      OperatorApi__Components__2__ReadyUrl: http://nats:8222/healthz

networks:
  backend:
    internal: true
